<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login – SmartOP OPD System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="auth-page">

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/index.html" class="brand-logo">
                    <div class="brand-icon">✚</div>
                    <span>SmartOP</span>
                </a>
                <h1>Doctor Portal</h1>
                <p>Sign in to manage OPD patient queue and consultations</p>
                <span class="auth-role-pill role-pill-doctor">Physician Access</span>
            </div>

            <!-- Demo Autofill Bar -->
            <div class="demo-creds-strip">
                <div class="demo-creds-info">
                    <span>Demo Doctor Account:</span>
                    <strong>doctor@smartop.com</strong>
                </div>
                <button type="button" class="btn-fill-demo" id="btn-autofill-doc">
                    Fill Demo
                </button>
            </div>

            <div id="doc-error-box" class="alert alert-error" style="display: none;"></div>

            <form id="doctor-login-form">
                <div class="form-group">
                    <label class="form-label" for="doc-email">Doctor Email</label>
                    <input type="email" id="doc-email" class="form-control" placeholder="doctor@smartop.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="doc-password">Password</label>
                    <input type="password" id="doc-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="btn-doc-submit">
                    Sign In to Consultation Room
                </button>
            </form>

            <div class="auth-footer">
                Need administrator assistance? <a href="/admin/login.html" style="font-weight: 700;">Admin Portal</a>
                <div style="margin-top: 0.75rem;">
                    <a href="/index.html">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('btn-autofill-doc').addEventListener('click', () => {
            document.getElementById('doc-email').value = 'doctor@smartop.com';
            document.getElementById('doc-password').value = 'doctor123';
        });

        document.getElementById('doctor-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('doc-error-box');
            errBox.style.display = 'none';

            const email = document.getElementById('doc-email').value;
            const password = document.getElementById('doc-password').value;
            const btn = document.getElementById('btn-doc-submit');

            btn.disabled = true;
            btn.textContent = 'Verifying Credentials...';

            try {
                await loginUser(email, password, 'DOCTOR');
                showToast("Welcome Doctor! Opening your consultation dashboard...", "success");
                window.location.href = '/doctor/dashboard.html';
            } catch (err) {
                errBox.textContent = err.message;
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In to Consultation Room';
            }
        });
    </script>
</body>
</html>
